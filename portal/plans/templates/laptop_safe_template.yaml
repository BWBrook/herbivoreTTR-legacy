schema_version: "1.0.0"
plan_id: "laptop_safe_demo"
description: "Conservative profile for everyday laptops."

execution:
  mode: "single"
  base_dir: "artefacts/portal_runs"
  dry_run: false
  write_outputs: true
  backend: "internal_ttr"
  compiled:
    enabled: "false"
    kernel_policy: "resistance_only"
    strict: false
    verbose: false
  parallel:
    execution_mode: "auto"
    hardware_tier: "laptop"
    workers: null
    reserve_cores: 1

scenario:
  source: "reference"
  reference: "canonical_smoke_v1"
  overrides:
    runtime:
      days: 7
      minute_limit: 90

sensitivity:
  enabled: false
  design: "one_at_a_time"
  keep_baseline: true
  parameters: []

outputs:
  render_report: true
  report_formats: ["html"]
  acceptance_profile: "standard"
  include_interactive: true
