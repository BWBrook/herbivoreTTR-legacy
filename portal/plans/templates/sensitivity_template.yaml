schema_version: "1.0.0"
plan_id: "sensitivity_demo_canonical"
description: "One-at-a-time sensitivity run for selected scenario settings."

execution:
  mode: "sensitivity"
  base_dir: "artefacts/portal_runs"
  dry_run: false
  write_outputs: true
  backend: "internal_ttr"
  compiled:
    enabled: "auto"
    kernel_policy: "resistance_only"
    strict: false
    verbose: false
  parallel:
    execution_mode: "auto"
    hardware_tier: "auto"
    workers: null
    reserve_cores: 1

scenario:
  source: "reference"
  reference: "canonical_smoke_v1"
  overrides:
    runtime:
      days: 10
      minute_limit: 90

sensitivity:
  enabled: true
  design: "one_at_a_time"
  keep_baseline: true
  parameters:
    - path: "runtime.days"
      values: [7, 14, 21]
    - path: "runtime.forage_access_scale"
      values: [0.6, 0.8, 1.0]

outputs:
  render_report: true
  report_formats: ["html"]
  acceptance_profile: "standard"
  include_interactive: true
