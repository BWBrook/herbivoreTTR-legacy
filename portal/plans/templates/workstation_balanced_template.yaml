schema_version: "1.0.0"
plan_id: "workstation_balanced_demo"
description: "Balanced profile for multi-core workstations."

execution:
  mode: "single"
  base_dir: "artefacts/portal_runs"
  dry_run: false
  write_outputs: true
  backend: "internal_ttr_compiled"
  compiled:
    enabled: "auto"
    kernel_policy: "resistance_only"
    strict: false
    verbose: false
  parallel:
    execution_mode: "auto"
    hardware_tier: "workstation"
    workers: null
    reserve_cores: 2

scenario:
  source: "reference"
  reference: "canonical_smoke_v1"
  overrides:
    runtime:
      days: 14
      minute_limit: 120

sensitivity:
  enabled: false
  design: "one_at_a_time"
  keep_baseline: true
  parameters: []

outputs:
  render_report: true
  report_formats: ["html"]
  acceptance_profile: "standard"
  include_interactive: true
