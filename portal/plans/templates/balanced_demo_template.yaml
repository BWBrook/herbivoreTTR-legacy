schema_version: "1.0.0"
plan_id: "balanced_demo_canonical"
description: "Short-horizon lower-stress ecological demo for first-time users."

execution:
  mode: "single"
  base_dir: "artefacts/portal_runs"
  dry_run: false
  write_outputs: true
  parallel:
    execution_mode: "auto"
    workers: null
    reserve_cores: 1

scenario:
  source: "reference"
  reference: "canonical_smoke_v1"
  overrides:
    runtime:
      days: 2
      minute_limit: 60
    climate:
      mode: "flat"

sensitivity:
  enabled: false
  design: "one_at_a_time"
  keep_baseline: true
  parameters: []

outputs:
  render_report: true
  report_formats: ["html"]
  acceptance_profile: "balanced_demo"
  include_interactive: true
