name: CI PR

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      r_cmd_check: ${{ steps.filter.outputs.r_cmd_check }}
      tests: ${{ steps.filter.outputs.tests }}
      lint: ${{ steps.filter.outputs.lint }}
      targets_smoke_fast: ${{ steps.filter.outputs.targets_smoke_fast }}
      targets_smoke_deep: ${{ steps.filter.outputs.targets_smoke_deep }}
    steps:
      - uses: actions/checkout@v4
      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            r_cmd_check:
              - "DESCRIPTION"
              - "NAMESPACE"
              - "R/**"
              - "man/**"
              - "inst/**"
              - "vignettes/**"
              - "renv.lock"
              - "Makefile"
              - ".github/workflows/**"
            tests:
              - "DESCRIPTION"
              - "NAMESPACE"
              - "R/**"
              - "tests/**"
              - "inst/**"
              - "vignettes/**"
              - "renv.lock"
              - "Makefile"
              - ".github/workflows/**"
            lint:
              - "DESCRIPTION"
              - "NAMESPACE"
              - "R/**"
              - "tests/**"
              - "inst/**"
              - "vignettes/**"
              - "renv.lock"
              - "Makefile"
              - ".github/workflows/**"
            targets_smoke_fast:
              - "_targets.R"
              - "R/**"
              - "scripts/**"
              - "config/**"
              - "profiles/**"
              - "portal/**"
              - "DESCRIPTION"
              - "renv.lock"
              - "Makefile"
              - ".github/workflows/**"
            targets_smoke_deep:
              - "_targets.R"
              - "scripts/**"
              - "config/**"
              - "profiles/**"
              - "portal/**"
              - "reports/**"
              - "R/paper_pipeline.R"
              - "R/reference_experiments_v1.R"
              - "R/reference_experiments_v2.R"
              - "R/release_pipeline.R"
              - "R/release_pipeline_v2.R"
              - "R/report_manifest_v2.R"
              - "R/claims_v1.R"
              - "R/performance_budget.R"
              - "R/scaling_profile_v1.R"
              - "R/stability_suite_v1.R"
              - "R/validation_metrics_v1.R"
              - "R/parallel_execution_v1.R"
              - "DESCRIPTION"
              - "renv.lock"
              - "Makefile"
              - ".github/workflows/**"

  r-cmd-check:
    name: R CMD check (ubuntu-latest)
    needs: changes
    if: needs.changes.outputs.r_cmd_check == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
      NOT_CRAN: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qpdf libglpk40

      - name: Restore renv
        uses: r-lib/actions/setup-renv@v2

      - name: Install check-only suggested packages
        run: R -q -e "install.packages(c('lintr', 'roxygen2'), repos = 'https://cloud.r-project.org')"

      - name: Build source package
        run: R CMD build .

      - name: Check source package (as-cran)
        run: >
          R -q -e "pkg <- tail(sort(Sys.glob('herbivoreTTR_*.tar.gz')), 1);
          if (!length(pkg)) stop('No source package found');
          status <- system2('R', c('CMD', 'check', '--as-cran', '--no-manual', '--no-tests', '--timings', pkg));
          if (!identical(status, 0L)) quit(status = status, save = 'no')"

  tests:
    name: Unit tests
    needs: changes
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglpk40

      - uses: r-lib/actions/setup-renv@v2

      - name: Run testthat suite
        run: make test

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.lint == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglpk40

      - uses: r-lib/actions/setup-renv@v2

      - name: Install lint dependency
        run: R -q -e "install.packages('lintr', repos = 'https://cloud.r-project.org')"

      - name: Lint package
        run: make lint

  targets-smoke-fast:
    name: Targets smoke (fast)
    needs: changes
    if: needs.changes.outputs.targets_smoke_fast == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TARGETS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglpk40

      - uses: r-lib/actions/setup-renv@v2

      - name: Smoke pipeline (fast)
        run: make smoke-fast

  targets-smoke:
    name: Targets smoke (ci profile)
    needs: changes
    if: needs.changes.outputs.targets_smoke_deep == 'true'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TARGETS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglpk40

      - uses: r-lib/actions/setup-renv@v2

      - name: Smoke pipeline
        run: make smoke-deep

      - name: Upload smoke artefacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artefacts-linux
          if-no-files-found: warn
          path: |
            data/outputs/*.csv
            artefacts/canonical_runs/**
