name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    name: R CMD check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y qpdf libglpk40

      - name: Restore renv
        uses: r-lib/actions/setup-renv@v2

      - name: Session info
        run: R -q -e "sessionInfo()"

      - name: Build source package
        run: R CMD build .

      - name: Check source package (as-cran)
        run: >
          R -q -e "pkg <- tail(sort(Sys.glob('herbivoreTTR_*.tar.gz')), 1);
          if (!length(pkg)) stop('No source package found');
          status <- system2('R', c('CMD', 'check', '--as-cran', '--no-manual', '--timings', pkg));
          if (!identical(status, 0L)) quit(status = status, save = 'no')"

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglpk40

      - uses: r-lib/actions/setup-renv@v2

      - name: Session info
        run: R -q -e "sessionInfo()"

      - name: Run testthat suite
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglpk40

      - uses: r-lib/actions/setup-renv@v2

      - name: Session info
        run: R -q -e "sessionInfo()"

      - name: Lint package
        run: make lint

  targets-smoke:
    name: Targets smoke (ci profile)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TARGETS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglpk40

      - uses: r-lib/actions/setup-renv@v2

      - name: Session info
        run: R -q -e "sessionInfo()"

      - name: Smoke pipeline
        run: make smoke

      - name: Upload smoke artefacts
        uses: actions/upload-artifact@v4
        with:
          name: smoke-artefacts-linux
          if-no-files-found: warn
          path: |
            data/outputs/*.csv
            artefacts/canonical_runs/**

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RUN_COVERAGE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y libglpk40

      - uses: r-lib/actions/setup-renv@v2

      - name: Session info
        run: R -q -e "sessionInfo()"

      - name: Run coverage test
        run: make test
