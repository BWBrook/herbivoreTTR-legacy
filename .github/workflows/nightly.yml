name: Nightly Deep Checks

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nightly-deep:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
      TARGETS_PROFILE: ci
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y qpdf libcurl4-openssl-dev libglpk-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Session info
        run: R -q -e "sessionInfo()"

      - name: Unit tests
        run: make test

      - name: Targets smoke
        run: make smoke

      - name: Deep ecological suites
        run: >
          R -q -e "for (f in list.files('R', pattern = '\\\\.R$', full.names = TRUE)) sys.source(f, envir = globalenv());
          run_long_horizon_stability_suite_v1(days = 120L, seeds = 801:803);
          run_experiment_a_presence_removal_v2(seeds = 301:308);
          run_experiment_c_aridity_gradient_v2(seeds = 701:708);
          run_pilot_validation_benchmark_v1()"

      - name: Render v1 report
        run: make render

      - name: Upload nightly artefacts
        uses: actions/upload-artifact@v4
        with:
          name: nightly-deep-artefacts
          if-no-files-found: warn
          path: |
            artefacts/canonical_runs/experiment_a_presence_removal_v2/**
            artefacts/canonical_runs/experiment_c_aridity_gradient_v2/**
            artefacts/stability/long_horizon_v1/**
            artefacts/validation/pilot_benchmark_v1/**
            artefacts/reports/**
