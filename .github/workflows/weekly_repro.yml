name: Weekly Repro Check

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: weekly-repro-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RENV_CONFIG_PAK_ENABLED: "FALSE"

jobs:
  weekly-repro:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_REPOS_OVERRIDE: https://cloud.r-project.org
      TARGETS_PROFILE: ci
      REPRO_V2_OUT_DIR: artefacts/reproducibility/weekly_repro_v2
      REPRO_V2_LIB_DIR: artefacts/reproducibility/weekly_repro_v2_library
      REPRO_V2_TARGETS_STORE: artefacts/reproducibility/weekly_repro_v2_targets
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - uses: r-lib/actions/setup-pandoc@v2
      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install -y qpdf libcurl4-openssl-dev libglpk-dev

      - uses: r-lib/actions/setup-renv@v2

      - name: Session info
        run: R -q -e "sessionInfo()"

      - name: External reproducibility run-through v2
        run: Rscript scripts/run_external_repro_check_v2.R "$REPRO_V2_OUT_DIR" "$REPRO_V2_LIB_DIR" "$REPRO_V2_TARGETS_STORE"

      - name: Upload reproducibility artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-repro-artefacts
          if-no-files-found: warn
          path: |
            artefacts/reproducibility/weekly_repro_v2/**
