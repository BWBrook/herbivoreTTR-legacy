schema_version: "1.0.0"
scenario_id: "reference_presence_present_v1"
runtime:
  seed: 301
  minute_limit: 120
  days: 7
  start_day: 1826
contrast:
  contrast_id: "experiment_a_presence_removal_v2"
  paired_with: "reference_presence_removed_v1"
  paired_contrast_required: true
  pairing_rules:
    - "runtime.seed"
    - "runtime.minute_limit"
    - "runtime.days"
    - "runtime.start_day"
    - "climate.mode"
    - "climate.mean_temp"
    - "climate.amplitude"
    - "climate.sw_scale"
    - "climate.n_scale"
plot:
  veg_types: [0, 1, 2]
  plot_size_m2: 10000
  plants_in_x: 20
  plants_in_y: 20
climate:
  mode: "flat"
  mean_temp: 15
  amplitude: 10
  sw_scale: 1
  n_scale: 1
population:
  mode: "explicit_single"
  cohort:
    - herbivore_id: "present_grazer"
      mass_g: 500000
      herb_type: 0
      MRT_hours: 24
      foraging_mode: "nutrient_targeting"
outputs:
  scenario_slug: "reference_presence_present_v1"
